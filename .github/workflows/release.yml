name: Release Assets

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libwayland-dev libegl1-mesa-dev libgbm-dev \
            libpixman-1-dev libxkbcommon-dev libinput-dev libudev-dev libseat-dev \
            shellcheck

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Validate release packager
        run: |
          bash -n scripts/build-release.sh
          shellcheck scripts/build-release.sh
          python3 -m unittest discover -s tests -p test_build_release.py -v
          sh -n resources/truss-session
          shellcheck resources/truss-session
          python3 tests/session_launcher.py -v

      - name: Format, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features

      - name: Build and package native release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          scripts/build-release.sh dist

      - name: Verify packaged executable and checksum
        run: |
          cd dist
          sha256sum --check ./*.sha256
          mkdir unpacked
          tar -xzf ./*.tar.gz -C unpacked
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("../Cargo.toml", "rb"))["package"]["version"])')
          test "$(unpacked/bin/truss --version)" = "truss $version"
          test -x unpacked/bin/truss-session
          test -f unpacked/share/wayland-sessions/truss.desktop
          test -f unpacked/lib/systemd/user/truss-session.target

      # gh run download RUN_ID --pattern 'truss-*-linux' --dir artifacts
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: truss-${{ matrix.arch }}-linux
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: truss-*-linux
          merge-multiple: true
          path: dist

      - name: Verify and publish both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version=${RELEASE_TAG#v}
          assets=()
          for arch in x86_64 aarch64; do
            archive="truss-${version}-${arch}-linux.tar.gz"
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum --check "$archive.sha256"
            assets+=("$archive" "$archive.sha256")
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Never replace existing assets: a name collision fails safely.
            gh release upload "$RELEASE_TAG" "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${assets[@]}"
          fi
          # Read back the exact release and require all four uploaded assets.
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python3 - "${assets[@]}" <<'PY'
          import json
          import sys
          with open("release-assets.json") as handle:
              names = {asset["name"] for asset in json.load(handle)["assets"]}
          missing = set(sys.argv[1:]) - names
          if missing:
              raise SystemExit(f"Missing release assets: {sorted(missing)}")
          PY
