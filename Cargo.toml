[package]
name = "truss"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mlua = { version = "0.10.3", features = ["luajit", "vendored", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "backend_egl", "renderer_gl", "desktop", "wayland_frontend"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-server = "0.31.14"
